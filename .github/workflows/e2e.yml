name: E2E

# End-to-end tests are slower than the other checks, so they run:
#   - on release PRs (into main), always;
#   - on any other PR once it has the "e2e" label (added, or already there
#     when new commits are pushed).
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ matrix.shard }}/3)
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'e2e') &&
      (github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'e2e'))
    # Playwright 1.59 has no browser builds for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      # Placeholders so the app builds and starts without real services. None
      # reach a real service: E2E emails go only to reserved test domains
      # (lib/email.ts skips them), and no spec calls Stripe or Google.
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PRO_PRICE_ID: price_ci_pro
      STRIPE_BUSINESS_PRICE_ID: price_ci_business
      RESEND_API_KEY: re_ci_placeholder
      NEXT_TELEMETRY_DISABLED: '1'
      # Production build, without reporting test errors to Sentry.
      NEXT_PUBLIC_SENTRY_DISABLED: '1'
      E2E_SERVER: start
    steps:
      - name: Check Neon access
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error::Set the NEON_API_KEY secret and the NEON_PROJECT_ID variable (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "EXPIRES=$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      # Each shard gets its own branch of the dev database (test data only,
      # never production), so shards can't disturb each other. It expires
      # after a day in case the delete step below never runs.
      - name: Create Neon branch
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: br-muddy-heart-a18vsqxc
          branch_name: ci/pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          expires_at: ${{ env.EXPIRES }}

      - name: Migrate
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}
          BETTER_AUTH_SECRET: ci-build-only-secret-0123456789abcdef0123456789

      - name: Run Playwright
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          npx playwright test --project=chromium --shard=${{ matrix.shard }}/3
          # The daily-job spec changes global data, so it runs last, alone,
          # in one shard (on that shard's own database branch).
          if [ "${{ matrix.shard }}" = "3" ]; then npx playwright test --project=jobs --no-deps; fi
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Delete Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.branch.outputs.branch_id }}
