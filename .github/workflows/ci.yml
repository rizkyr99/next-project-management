name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same PR or branch cancels the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Placeholders so the app builds and starts without real services. None
      # reach a real service: E2E emails go only to reserved test domains
      # (lib/email.ts skips them), and no spec calls Stripe or Google.
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PRO_PRICE_ID: price_ci_pro
      STRIPE_BUSINESS_PRICE_ID: price_ci_business
      RESEND_API_KEY: re_ci_placeholder
      NEXT_TELEMETRY_DISABLED: '1'
      # Never connected to during the build; the real URL lives in Vercel.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-build-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Catches what tsc and lint don't: invalid route segment config,
      # server/client boundary mistakes, prerender failures.
      - run: npm run build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway CI container: password-less auth, nothing to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A fresh database must be buildable purely from migration history.
      - run: npm run db:migrate
      - run: npm run db:check
      # Fail if schema.ts has changes that no migration captures.
      - name: Schema drift check
        run: |
          npm run db:generate -- --name ci_drift_check
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::error::db/schema.ts has changes without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain db/migrations
            exit 1
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=lcov --coverage.reporter=json-summary
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  e2e:
    name: E2E
    # Pull requests only: each run gets its own Neon branch, deleted afterwards.
    if: github.event_name == 'pull_request'
    # Playwright 1.59 has no browser builds for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Placeholders so the app builds and starts without real services. None
      # reach a real service: E2E emails go only to reserved test domains
      # (lib/email.ts skips them), and no spec calls Stripe or Google.
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PRO_PRICE_ID: price_ci_pro
      STRIPE_BUSINESS_PRICE_ID: price_ci_business
      RESEND_API_KEY: re_ci_placeholder
      NEXT_TELEMETRY_DISABLED: '1'
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - name: Check Neon access
        id: neon
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::E2E skipped: set the NEON_API_KEY secret and the NEON_PROJECT_ID variable (Settings → Secrets and variables → Actions). Pull requests from forks never get them."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "expires=$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.neon.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.neon.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.neon.outputs.enabled == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.neon.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.neon.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      # Branched from the dev branch (test data only), never from production.
      # It expires after a day in case the delete step below never runs.
      - name: Create Neon branch
        id: branch
        if: steps.neon.outputs.enabled == 'true'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: br-muddy-heart-a18vsqxc
          branch_name: ci/pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.neon.outputs.expires }}

      - name: Migrate
        if: steps.neon.outputs.enabled == 'true'
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}

      - name: Run Playwright
        if: steps.neon.outputs.enabled == 'true'
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          npx playwright test
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}

      - uses: actions/upload-artifact@v4
        if: failure() && steps.neon.outputs.enabled == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Delete Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.branch.outputs.branch_id }}
